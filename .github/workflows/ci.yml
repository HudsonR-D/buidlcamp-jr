name: Review and test
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Verify reviewed file list
        run: node scripts/release-files.mjs --check
      - name: Install pinned secret scanner
        run: |
          curl --fail --location --silent --show-error https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks git . --redact --no-banner
          /tmp/gitleaks dir . --redact --no-banner
      - run: npm ci
        working-directory: app
      - run: npm run format:check && npm run lint && npm test && npm run build && npm audit --audit-level=moderate
        working-directory: app
      - name: Check generated curriculum and license notices
        run: |
          npm run review:program
          npm run review:licenses
          git diff --exit-code
        working-directory: app
      - name: Scan production assets
        run: /tmp/gitleaks dir app/dist --redact --no-banner
  browsers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci && npx playwright install --with-deps ${{ matrix.browser }} && npm run build
        working-directory: app
      - name: Accessibility acceptance
        if: matrix.browser == 'chromium'
        run: npm run test:accessibility
        working-directory: app
      - run: npm run test:browser && npm run test:release
        working-directory: app
        env:
          BUIDLCAMP_BROWSER: ${{ matrix.browser }}
